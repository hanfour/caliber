name: Post-release smoke

# Plan 4C Part 11 — fires after the Release workflow succeeds (or via
# workflow_dispatch). Runs the evaluator smoke script against the canary
# environment plus a thin Playwright spec covering the cost dashboard render.
# A failure opens a GitHub issue tagged `release-blocker` so the rollout is
# paused until the underlying defect is fixed.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Preflight canary secrets
        env:
          CANARY_API_BASE_URL: ${{ secrets.CANARY_API_BASE_URL }}
          CANARY_GATEWAY_BASE_URL: ${{ secrets.CANARY_GATEWAY_BASE_URL }}
          CANARY_ADMIN_SESSION_COOKIE: ${{ secrets.CANARY_ADMIN_SESSION_COOKIE }}
          CANARY_GATEWAY_API_KEY: ${{ secrets.CANARY_GATEWAY_API_KEY }}
          CANARY_ORG_ID: ${{ secrets.CANARY_ORG_ID }}
          CANARY_USER_ID: ${{ secrets.CANARY_USER_ID }}
        run: |
          missing=()
          for secret_name in \
            CANARY_API_BASE_URL \
            CANARY_GATEWAY_BASE_URL \
            CANARY_ADMIN_SESSION_COOKIE \
            CANARY_GATEWAY_API_KEY \
            CANARY_ORG_ID \
            CANARY_USER_ID
          do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if ((${#missing[@]} > 0)); then
            echo "::error::Canary environment may not exist yet. Missing required secrets: ${missing[*]}. Configure the canary environment before running post-release smoke."
            exit 1
          fi

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @caliber/web exec playwright install --with-deps chromium

      - name: Run smoke-evaluator.sh
        env:
          API_BASE_URL: ${{ secrets.CANARY_API_BASE_URL }}
          GATEWAY_BASE_URL: ${{ secrets.CANARY_GATEWAY_BASE_URL }}
          ADMIN_SESSION_COOKIE: ${{ secrets.CANARY_ADMIN_SESSION_COOKIE }}
          GATEWAY_API_KEY: ${{ secrets.CANARY_GATEWAY_API_KEY }}
          ORG_ID: ${{ secrets.CANARY_ORG_ID }}
          USER_ID: ${{ secrets.CANARY_USER_ID }}
        run: bash scripts/smoke-evaluator.sh

      - name: Run Playwright post-release spec
        env:
          CANARY_BASE_URL: ${{ secrets.CANARY_API_BASE_URL }}
          CANARY_SESSION_COOKIE: ${{ secrets.CANARY_ADMIN_SESSION_COOKIE }}
          CANARY_ORG_ID: ${{ secrets.CANARY_ORG_ID }}
        run: pnpm --filter @caliber/web exec playwright test specs/99-post-release-smoke.spec.ts

      - name: On failure — open issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.event.workflow_run.head_branch || github.ref_name || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          gh label create release-blocker \
            --color B60205 \
            --description "Post-release smoke failure requiring investigation before rollout" \
            --force
          gh issue create \
            --title "Post-release smoke failed: $RELEASE_REF" \
            --body "Smoke workflow failed after release.

          Run: $RUN_URL

          This is a release-blocker. Investigate before promoting $RELEASE_REF to user-facing rollout." \
            --label release-blocker
